name: CI
on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install modules
        run: npm ci

      - name: Debug test environment
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Test files found:"
          find test -name "*.test.*" | sort
          echo "Jest config:"
          cat jest.config.cjs

      - name: Prepare Jest cache
        run: npm run testCacheCreate
        continue-on-error: true

      - name: Run tests with verbose output
        run: npm test -- --verbose

      - run: npm run build --if-present

  puppeteer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Cache Puppeteer browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('test/puppeteer/package-lock.json') }}

      - name: Install Puppeteer test dependencies
        run: npm ci
        working-directory: test/puppeteer

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac &
          sleep 1
        working-directory: test/puppeteer

      - name: Run puppeteer tests (shard ${{ matrix.shard }}/3)
        run: |
          # Define test groups for each shard
          if [ ${{ matrix.shard }} -eq 1 ]; then
            TESTS=(
              "suspend-discard.test.ts"
              "corrupt-storage.test.ts"
              "basic-suspend-restore.test.ts"
              "auto-restore-tab.test.ts"
              "restore-modes.test.ts"
              "form-data-restore.test.ts"
              "protected-urls.test.ts"
              "whitelist-ignore.test.ts"
              "favicon-loss.test.ts"
              "favicon-nav-stress.test.ts"
            )
          elif [ ${{ matrix.shard }} -eq 2 ]; then
            TESTS=(
              "screenshot-settings.test.ts"
              "discard-tab-id-change.test.ts"
              "unfocused-tab-discard.test.ts"
              "start-discarded.test.ts"
              "bulk-tab-operations.test.ts"
              "adaptive-timeout.test.ts"
              "pinned-tab-protection.test.ts"
              "multi-window-suspend.test.ts"
              "url-param-preserve.test.ts"
              "extension-icon.test.ts"
            )
          else
            TESTS=(
              "service-worker-alive.test.ts"
              "tab-group-session-restore.test.ts"
              "tab-group-session-restore-collapsed.test.ts"
              "tab-group-session-restore-autorestore.test.ts"
              "tab-group-blank-endstate-regression.test.ts"
              "tab-group-blank-url-revert.test.ts"
              "tab-group-restart-blank-recovery.test.ts"
            )
          fi

          for test in "${TESTS[@]}"; do
            echo "=== Running $test ==="
            DISPLAY=:99 npx tsx "$test"
          done
        working-directory: test/puppeteer